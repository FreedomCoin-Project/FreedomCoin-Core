version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Rust: librustzcash is statically linked into the released binaries,
  # so these dependencies do ship and are worth tracking.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"

# Note: src/chiabls/js-bindings is vendored upstream tooling for using BLS
# from JavaScript. It is not referenced by the build system and is never
# compiled or shipped, so npm scanning is deliberately not configured.
